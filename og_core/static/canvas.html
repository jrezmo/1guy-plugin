/* phone: the trail is one compact back chip */
.fx-crumb-back { background: rgba(21, 23, 27, .92) !important; border: 1px solid var(--edge2) !important; border-radius: 999px !important; padding: 7px 12px !important; color: var(--text) !important; max-width: 60vw !important; }
/* the street of rooms is on the first screen at 1440x900 */
.og-tiles-hd { margin-top: 26px; }
.og-made-hd { margin-top: 30px; }
@media (min-width: 701px) { .og-place-art { max-width: 150px; } .og-tiles { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); } }
/* in the briefing his offer is a line under his headline, not a pill over the rooms */
.fx-next.fx-next-inline { position: static; display: block; padding: 0; margin: 14px 0 0 46px; pointer-events: auto; }
.fx-next-inline .fx-next-chip { box-shadow: none; background: rgba(255, 181, 71, .06); max-width: 100%; }
.fx-next-inline .fx-next-orb { display: none; }
@media (max-width: 700px) { .fx-next.fx-next-inline { margin-left: 40px; } }
.og-st.fx-world { white-space: normal; text-transform: none; font-weight: 500; }
/* the phone header is two rows, always — also while the sounds question is up */
@media (max-width: 700px) {
  #og-snd { flex: none; }
  #og-snd.og-snd-asking .og-snd-t { display: none; }                      /* "♪ on · off" */
  #og-snd.og-snd-asking { padding-left: 9px; }
  body:has(#og-snd.og-snd-asking) .og-rail-handle-t { display: none; }     /* put away shows just its count meanwhile */
  body.og-rail-has:has(#og-snd.og-snd-asking) #og-sum { margin-right: 58px; }
  body:has(#og-snd.og-snd-asking) .og-rail-handle { right: 118px; padding-left: 8px; }
}
/* a room's name and count sit ABOVE its picture, so they're never the part under the talk bar */
.og-place.og-tile { padding: 0 4px 6px; }
.og-place-nm.og-tile-t { order: -2; margin-top: 0; }
.og-place-ct.og-tile-n { order: -1; margin-bottom: 2px; }
.og-place-tags { top: 46px; }
.og-place::before { top: calc(46px + 4%); }
.og-place-ct.og-tile-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
/* checkpoint 1 (phone): the top row carries ONE number, his count. "N more waiting", "N working" and
   "broke" live in his headline; put-away collapsed to its count keeps a tray mark so it isn't an orphan digit */
@media (max-width: 700px) {
  #og-sum span + span, #og-sum a.og-working { display: none !important; }
  body:has(#og-snd.og-snd-asking) .og-rail-handle::before { content: "⤓"; font-size: 14px; color: var(--muted); }
  .og-rail-handle { white-space: nowrap; }
}
/* real-sized board (first-sight pass on ~170 cards): inbox faces are as tall as their words, and a card
   under "waiting on a yes or no" doesn't also wear a "needs you" chip */
body[data-og-lens="inbox"] .og-card[data-size="hero"] { min-height: 0; }
body[data-og-lens="inbox"] .og-card .kf-st.st-needs-you { display: none; }

/* ↺ recent: a real drawer of what you touched, wherever it is now (focus.js) */
.fx-recent-m { min-width: 320px; max-width: min(420px, 92vw); max-height: min(70vh, 560px); overflow-y: auto; }
.fx-recent-h { padding: 6px 11px 4px; font: 600 10.5px/1 Inter, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.fx-recent-i { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; white-space: normal; }
.fx-recent-t { font: 500 13.5px/1.25 Inter, system-ui, sans-serif; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.fx-recent-s { font: 12px/1.2 Inter, system-ui, sans-serif; color: var(--faint); }
.fx-recent-off .fx-recent-t { color: var(--muted); }
.fx-recent-i:disabled { opacity: .5; cursor: default; }
@media (max-width: 700px) { .fx-recent-m { position: fixed; left: 8px; right: 8px; top: auto; bottom: calc(118px + var(--og-sab)); max-width: none; max-height: min(52vh, 460px); }
  /* a card is open: the sheet clears its done/later row, and ↺ is a real thumb target */
  body.og-focused .fx-recent-m, body:has(.og-bloom.fx-focus) .fx-recent-m { bottom: calc(142px + var(--og-sab)); }
  .fx-recent-b { min-width: 36px; min-height: 36px; } .fx-recent-t { font-size: 15px; } .fx-recent-s { font-size: 13px; } }
/* ↺ lives in the header's tabs row, never over a card (it read as the card's second button) */
@media (max-width: 700px) {
  .fx-trail.fx-trail-idle { top: calc(52px + var(--og-sat)); bottom: auto; left: 12px; right: auto; z-index: 21; }
  .fx-trail-idle .fx-recent-b { width: 38px; height: 38px; padding: 0; font-size: 17px; }
  body.fx-recent-idle.og-mobile #og-lens { width: calc(100% - 46px); flex: 0 0 calc(100% - 46px); margin-left: auto !important; }
  body.fx-recent-idle.og-mobile #og-lens button { padding: 9px 2px; font-size: 14.5px; white-space: nowrap; }
  body.og-focusing .fx-trail.fx-trail-idle, body.og-col-open .fx-trail.fx-trail-idle { display: none; }
}
/* a face's live line keeps its dot beside its words (the text wraps in its own box) */
.og-live-line { flex-wrap: nowrap; align-items: baseline; }
.og-live-line .og-live-t { flex: 1 1 0; min-width: 0; }
.og-live-line .og-live-dot { position: relative; top: -1px; }
/* an empty lens says so (sparse home / nothing waiting) */
.og-empty { position: absolute; left: 0; right: 0; top: 38%; text-align: center; padding: 0 24px; pointer-events: none;
  font: 500 18px/1.4 Inter, system-ui, sans-serif; color: var(--muted); }
body[data-view="briefing"] .og-empty { display: none; }
/* phone: the open card says where its conversation lives + the Hermes door + where a line went (desktop: the chat column's header) */
.fx-where, .fx-where-note { display: none; }
@media (max-width: 700px) {
  .fx-where { display: flex; align-items: center; gap: 10px; margin-top: 8px; font: 500 13px/1.3 Inter, system-ui, sans-serif; color: var(--faint); }
  .fx-where-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-where-h { margin-left: auto; flex: none; color: var(--muted); text-decoration: none; padding: 6px 0 6px 8px; }
  .fx-where-h[hidden] { display: none; }
  .og-bloom.fx-focus .sf-open { display: none; }   /* one Hermes link per open card: the one under its title */
  .fx-where-sid { font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: #6f727a; }
  .fx-where-note:not([hidden]) { display: block; margin-top: 8px; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; color: #c9a46e; background: rgba(255, 181, 71, .06); }
}

/* ---------------------------------------------------------------- the two doors (doors.js) */
/* door B: one big box, the cards beside it. his question is the briefing line above. */
.og-doorb { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; margin: 4px 0 26px; }
.og-doorb[hidden] { display: none; }
.og-doorb-pad { display: flex; flex-direction: column; border-radius: 22px; background: var(--card); border: 1px solid var(--edge2);
  box-shadow: 0 18px 46px rgba(0, 0, 0, .4); transition: border-color 280ms, box-shadow 280ms; }
.og-doorb-pad:focus-within { border-color: rgba(255, 181, 71, .55); box-shadow: 0 0 0 3px rgba(255, 181, 71, .08), 0 18px 46px rgba(0, 0, 0, .4); }
.og-doorb-in { display: block; width: 100%; min-height: 236px; box-sizing: border-box; resize: none; border: 0; outline: 0; background: transparent;
  padding: 22px 24px 8px; color: var(--text); font: 500 21px/1.5 Inter, system-ui, sans-serif; letter-spacing: -.01em; caret-color: var(--amber); }
.og-doorb-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 24px 16px; }
.og-doorb-hint { font-size: 15px; color: var(--muted); }
.og-doorb-sample { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 13.5px; color: var(--dim, #6f727a); cursor: pointer;
  text-decoration: underline; text-decoration-color: rgba(255, 255, 255, .16); text-underline-offset: 3px; white-space: nowrap; }
.og-doorb-sample:hover, .og-doorb-sample:focus-visible { color: var(--amber); }
.og-doorb-side { min-height: 60px; }
.og-doorb-cards { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding: 2px 4px 2px 2px; scrollbar-width: thin; }
.og-doorb-card { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 13px 16px; border-radius: 14px; background: var(--card);
  border: 1px solid var(--edge); cursor: pointer; transition: border-color 240ms, transform 240ms, opacity 240ms; }
.og-doorb-card:hover { border-color: var(--edge2); transform: translateY(-1px); }
.og-doorb-card:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.og-doorb-dot { flex: 0 0 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); transform: translateY(-1px); transition: background 300ms; }
.og-doorb-card[data-state="pending"] { opacity: .78; }
.og-doorb-card[data-state="pending"] .og-doorb-dot { background: var(--dim, #6f727a); }
.og-doorb-card[data-state="failed"] { border-color: rgba(255, 110, 100, .45); }
.og-doorb-card[data-state="failed"] .og-doorb-dot { background: #ff6e64; }
.og-doorb-t { flex: 1 1 0; min-width: 0; font: 500 16.5px/1.35 Inter, system-ui, sans-serif; color: var(--text); overflow-wrap: anywhere; }
.og-doorb-s { flex-basis: 100%; padding-left: 18px; font-size: 13px; color: #ff9d95; }
.og-doorb-s:empty { display: none; }
.og-doorb-status { min-height: 20px; margin-top: 10px; padding-left: 4px; font-size: 14px; color: var(--muted); }
.og-doorb:not(.og-doorb-has) .og-doorb-side { display: none; }
.og-doorb:not(.og-doorb-has) { grid-template-columns: minmax(0, 720px); }
/* his last line of the door, under the rail */
.og-door-close { margin: 4px 0 26px; padding-left: 46px; font: 500 19px/1.35 Inter, system-ui, sans-serif; color: #f2c682; }
.og-door-close[hidden] { display: none; }
@media (max-width: 760px) {
  .og-doorb { grid-template-columns: minmax(0, 1fr); gap: 14px; margin-bottom: 18px; }
  .og-doorb-in { min-height: 148px; padding: 16px 18px 6px; font-size: 18px; }
  .og-doorb-foot { padding: 6px 18px 12px; flex-wrap: wrap; }
  .og-doorb-sample { padding: 10px 0; }
  .og-doorb-cards { max-height: none; }
  .og-doorb-card { padding: 14px 15px; }
  .og-door-close { padding-left: 4px; font-size: 17px; }
}

/* ---------------------------------------------------------------- the sample desk (?sample=1) */
/* a fixed chip says where you are; every card wears the word. nothing here is the user's. */
.og-sample-chip { position: fixed; z-index: 90; left: 50%; top: calc(12px + var(--og-sat, 0px)); transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
  padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(255, 181, 71, .55); background: rgba(38, 30, 16, .96); color: #f2c682;
  font: 600 13.5px/1 Inter, system-ui, sans-serif; letter-spacing: .01em; cursor: pointer; box-shadow: 0 8px 26px rgba(0, 0, 0, .45); }
.og-sample-chip-x { font-weight: 500; color: #d9b98a; text-decoration: underline; text-underline-offset: 3px; }
.og-sample-chip:hover .og-sample-chip-x, .og-sample-chip:focus-visible .og-sample-chip-x { color: #fff; }
body.og-sample .og-card, body.og-sample .og-fy, body.og-sample .og-room-it, body.og-sample .og-glance, body.og-sample .og-chip { position: relative; }
body.og-sample .og-card::before, body.og-sample .og-fy::before, body.og-sample .og-room-it::before, body.og-sample .og-glance::before, body.og-sample .og-chip::before {
  content: "sample"; position: absolute; z-index: 3; top: -8px; left: 14px; padding: 2px 8px 3px; border-radius: 999px; pointer-events: none;
  font: 600 10.5px/1.2 Inter, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #201807; background: #e9b869; }
body.og-sample .og-chip::before { top: -6px; left: auto; right: 8px; font-size: 9px; padding: 1px 6px 2px; }
body.og-sample .og-glance::before { top: 9px; left: auto; right: 30px; }   /* inside the tile: the row above would clip it */
body.og-sample .tk-bar { display: none; }   /* nothing typed here would be saved: there is nothing to type into */
@media (max-width: 760px) { .og-sample-chip { top: auto; bottom: calc(14px + var(--og-sab, 0px)); padding: 12px 18px; } }

/* his offer to keep an eye on email + calendar (briefing.js renderOffer; board/mailcal.py) */
.og-offer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 2px 0 14px; padding: 12px 16px;
  border-radius: 14px; border: 1px solid var(--edge2, rgba(255,255,255,.14)); background: rgba(242,198,130,.06); }
.og-offer[hidden] { display: none; }
.og-offer-t { flex: 1 1 280px; font: 500 15px/1.4 Inter, system-ui, sans-serif; color: #f2c682; }
.og-offer-b { padding: 7px 14px; border-radius: 10px; cursor: pointer; font: 600 13px/1.2 Inter, system-ui, sans-serif;
  color: var(--text, #e9e9ee); background: rgba(255,255,255,.04); border: 1px solid var(--edge2, rgba(255,255,255,.14)); }
.og-offer-b:hover { border-color: var(--amber, #f2c682); }
.og-offer-b:focus-visible { outline: 2px solid var(--teal, #5ad1c3); outline-offset: 2px; }
.og-offer-b[disabled] { opacity: .5; cursor: default; }
.og-offer-yes { color: #1a1408; background: #f2c682; border-color: #f2c682; }
/* ---------------------------------------------------------------- the claim frame (frontier 4)
   The cards a turn is working on: a quiet dashed outline and one small -ing word (live.js draws it,
   surface.js owns its life). Never amber: it says "being worked on", not "look here". */
.og-claim { outline: 1.5px dashed rgba(236, 235, 230, .46); outline-offset: 4px; }
.og-fold.og-claim { overflow: visible; }
.og-place.og-claim { outline-offset: 2px; border-radius: 14px; }
.og-place > .og-claim-tag { left: 50%; top: -4px; transform: translateX(-50%); }
/* an open card clips its edges: there the word sits in the quiet stretch of its button row */
.og-bloom > .og-claim-tag { left: auto; top: auto; right: 100px; bottom: 17px; }
@media (max-width: 700px) {
  .og-bloom > .og-claim-tag { right: 94px; bottom: 22px; height: 24px; font-size: 13px; padding: 0 9px; }
  .og-bloom > .og-claim-tag .og-claim-x { display: none; }   /* the thread's own stop is right above it */
}
.og-fy.og-claim { position: relative; }   /* never the open card: it is position: fixed already, and making it relative dropped it out of its sheet (it grew past the screen and its buttons went under the talk bar) */
.og-claim-tag { position: absolute; left: 12px; top: -12px; z-index: 4; display: inline-flex; align-items: center; gap: 2px;
  height: 22px; padding: 0 4px 0 9px; border-radius: 11px; background: #23252b; border: 1px solid var(--edge2);
  color: var(--text); font: 500 12.5px/1 Inter, system-ui, sans-serif; letter-spacing: 0; white-space: nowrap; cursor: default; }
.og-claim-tag:not(:has(.og-claim-x)) { padding-right: 9px; }
.og-claim-tag[data-state="job"] { color: var(--muted); }
.og-claim-tag[data-state="said"] { color: var(--warm); }
.og-claim-x { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 10px;
  color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer; }
.og-claim-x:hover { color: var(--text); background: rgba(255, 255, 255, .08); }
@media (max-width: 700px) {
  .og-claim-tag { height: 28px; top: -15px; border-radius: 14px; font-size: 14px; padding-left: 11px; }
  .og-claim-x { width: 30px; height: 28px; font-size: 18px; }
}
@media (prefers-reduced-motion: no-preference) { .og-claim { animation: og-claim-in 240ms var(--ease); } }
@keyframes og-claim-in { from { outline-color: rgba(236, 235, 230, 0); outline-offset: 10px; } }

/* ---------------------------------------------------------------- the phone pass (frontier 7.5; tests/e2e_phone.py)
   body.og-mobile is main.js's isMobile() (≤ 700px). Every rule here is prefixed with it so it wins
   whatever order the other sheets load in. --og-kb is the on-screen keyboard's height (main.js, visualViewport). */
:root { --og-kb: 0px; }
/* nothing reads through the header or the talk bar: both stand on solid ink, and the page fades out before the bar */
body.og-mobile #og-top { background: linear-gradient(var(--ink) 84%, rgba(16, 17, 20, 0)); padding: calc(6px + var(--og-sat)) 14px 16px 12px; row-gap: 6px; }
body.og-mobile.og-focusing #og-top { background: var(--ink); }
body.og-mobile #og-brief::after { height: calc(150px + var(--og-sab) + var(--og-kb)); z-index: 3;
  background: linear-gradient(to top, var(--ink) 0, var(--ink) calc(72px + var(--og-sab) + var(--og-kb)), rgba(16, 17, 20, 0) 100%); }
body.og-mobile #og-stage::after { background:
  linear-gradient(to top, var(--ink) 0, var(--ink) calc(72px + var(--og-sab) + var(--og-kb)), rgba(16, 17, 20, 0) calc(150px + var(--og-sab) + var(--og-kb))); }
body.og-mobile .tk-bar { background: #15171b; bottom: calc(18px + env(safe-area-inset-bottom, 0px) + var(--og-kb)); }
body.og-mobile.og-kb .tk-bar { bottom: calc(8px + var(--og-kb)); }
body.og-mobile .og-brief-col { padding-bottom: calc(150px + var(--og-sab) + var(--og-kb)); }
body.og-mobile.og-kb #og-brief { scroll-padding: calc(120px + var(--og-sat)) 0 calc(96px + var(--og-sab) + var(--og-kb)); }
body.og-mobile .tk-reply { bottom: calc(74px + env(safe-area-inset-bottom, 0px) + var(--og-kb)); }
body.og-mobile.og-kb .og-sample-chip { display: none; }
/* his words start clear of the orb */
body.og-mobile .og-brief-line, body.og-mobile .og-brief-hint { padding-left: 46px; }
/* a finger needs 44px. the header is two 44px rows in the room it already had */
body.og-mobile #og-mark { min-height: 44px; padding: 3px 10px 4px 6px; }
body.og-mobile #og-snd .og-snd-b, body.og-mobile #og-snd.og-snd-asking button, body.og-mobile #og-lens button,
body.og-mobile .tk-mic, body.og-mobile .tk-stop, body.og-mobile .tk-about-x, body.og-mobile .sf-tag, body.og-mobile .og-claim-x,
body.og-mobile .og-col-x, body.og-mobile .og-col-stop, body.og-mobile .og-col-open, body.og-mobile .fx-where-h, body.og-mobile .fx-recent-b { position: relative; }
body.og-mobile #og-snd .og-snd-b::after, body.og-mobile #og-snd.og-snd-asking button::after, body.og-mobile #og-lens button::after,
body.og-mobile .tk-mic::after, body.og-mobile .tk-stop::after, body.og-mobile .tk-about-x::after, body.og-mobile .sf-tag::after, body.og-mobile .og-claim-x::after,
body.og-mobile .og-col-x::after, body.og-mobile .og-col-stop::after, body.og-mobile .og-col-open::after, body.og-mobile .fx-where-h::after, body.og-mobile .fx-recent-b::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }
body.og-mobile .tk-input { min-height: 44px; margin: -5px 0; }
body.og-mobile .fx-verb, body.og-mobile .og-verb, body.og-mobile .og-offer-b, body.og-mobile .og-sel-b, body.og-mobile .og-parked-go { min-height: 44px; }
body.og-mobile .fx-verb { display: inline-flex; align-items: center; }
body.og-mobile #og-snd.og-snd-asking button { min-width: 44px; justify-content: center; }
body.og-mobile .fx-next-go, body.og-mobile .fx-next-no, body.og-mobile .fx-slot, body.og-mobile .fx-link, body.og-mobile .og-showall,
body.og-mobile .fx-recent-i, body.og-mobile .og-fold, body.og-mobile .og-made-item { min-height: 44px; }
body.og-mobile .fx-link, body.og-mobile .og-showall { display: inline-flex; align-items: center; }
body.og-mobile button.fx-crumb { min-height: 44px; }
body.og-mobile .og-bloom-x, body.og-mobile .fx-recent-b, body.og-mobile .fx-trail-idle .fx-recent-b { width: 44px; height: 44px; min-width: 44px; min-height: 44px; }
body.og-mobile .og-made-t, body.og-mobile .sf-text, body.og-mobile .sf-turn { font-size: 15px; }
body.og-mobile .og-doorb-sample { min-height: 44px; font-size: 15px; }
body.og-mobile .og-sample-chip { min-height: 44px; }
body.og-mobile .og-doorb-card { min-height: 48px; }
/* anything that reads as a sentence is 15px */
body.og-mobile .og-fy-whytag, body.og-mobile .og-live-t, body.og-mobile .kg-next, body.og-mobile .kg-next small, body.og-mobile .kg-unwired .kg-next,
body.og-mobile .og-doorb-s, body.og-mobile .og-doorb-status, body.og-mobile .og-offer-b, body.og-mobile .og-made-w,
body.og-mobile .fx-where, body.og-mobile .fx-where-note:not([hidden]), body.og-mobile .fx-link, body.og-mobile .og-when, body.og-mobile .fx-recent-s,
body.og-mobile .tk-reply, body.og-mobile .tk-undo, body.og-mobile .tk-confirm, body.og-mobile .tk-about,
body.og-mobile .og-col-row.sf-j, body.og-mobile .og-col-row.sf-guy, body.og-mobile .og-col-q-t, body.og-mobile .og-col-ttl, body.og-mobile .og-col-note,
body.og-mobile .og-claim-tag, body.og-mobile .fx-trail, body.og-mobile .sf-err { font-size: 15px; }
body.og-mobile .og-col-why, body.og-mobile .og-col-q-h { font-size: 13px; }
/* door B: the box is as tall as what he has typed (doors.js grows it), not a third of the screen */
body.og-mobile .og-doorb-in { height: 96px; min-height: 96px; max-height: 42vh; }
body.og-mobile .og-doorb-foot { padding: 0 18px 4px; gap: 0 12px; align-items: center; }
/* press-and-hold is ours (preview, lift, lasso): no iOS callout, no text selection, and the page still scrolls under a moving finger */
body.og-mobile #og-stage, body.og-mobile .og-card, body.og-mobile .og-fy, body.og-mobile .og-glance, body.og-mobile .og-region-l, body.og-mobile .og-fold,
body.og-mobile .fx-verb, body.og-mobile .og-verb, body.og-mobile .og-doorb-card, body.og-mobile .og-chip, body.og-mobile .og-place, body.og-mobile .og-room-it,
body.og-mobile #og-top, body.og-mobile .tk-mic, body.og-mobile .og-sel-menu, body.og-mobile .og-rail-tab {
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
body.og-mobile .og-fy, body.og-mobile .og-glance, body.og-mobile .og-doorb-card, body.og-mobile .og-chip { touch-action: pan-y; }
body.og-mobile .fx-verb, body.og-mobile .og-verb { touch-action: manipulation; }

/* the furniture a thumb has to hit is 44px, and a sentence is 15px or more */
@media (max-width: 700px) {
  #og-snd .og-snd-yes, #og-snd .og-snd-no, #og-snd .og-snd-b { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .fx-next-go, .fx-next-no { min-height: 44px; min-width: 56px; }
  .og-bloom.fx-focus .og-bloom-x { min-width: 44px; min-height: 44px; }
  .og-bloom.fx-focus .fx-slot, .og-bloom.fx-focus .fx-more, .og-bloom.fx-focus .fx-slots button { min-height: 44px; }
  /* the taller buttons don't make the pinned bar taller (it sat over the last row of connection chips) */
  .og-bloom.fx-focus .bloom-actions { padding: 8px 16px 8px; }
  .og-bloom.fx-focus { scroll-padding-bottom: 76px; }
  .fx-recent-b, .fx-trail-idle .fx-recent-b { min-width: 44px; min-height: 44px; width: auto; height: auto; }
  .og-showall { min-height: 44px; padding-top: 8px; padding-bottom: 8px; }
  .og-made-t { font-size: 15px; }
  .og-made-k { font-size: 11px; }
}

/* home/kinds/kinds.css */
/* 1guy home · kinds (WS-A2): card faces (.kf inside the shell's card element,
   which gets .kc .kc-<kind>) and bloom bodies (.kb inside [data-slot=body]).
   Sizes come from [data-size] on the card element: hero | card | compact | chip.
   Look pinned in media/README.md. Inter only; amber = the one guy + needs you;
   teal = links/tendrils. */

.kc, .kb {
  --k-card: #1b1d22; --k-edge: #2a2d34; --k-edge2: #33363e;
  --k-amber: #ffb547; --k-warm: #ffd9a0; --k-teal: #5ad1c3; --k-red: #ef6b6b;
  --k-text: #ecebe6; --k-muted: #a9aab0; --k-dim: #8b8d94; --k-faint: #6f727a;
  --k-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --k-spring: cubic-bezier(.2, .9, .25, 1.08);
  --k-ease: cubic-bezier(.22, .8, .24, 1);
}

/* ================= card faces ================= */
.kf {
  display: flex; flex-direction: column; min-width: 0; height: 100%;
  color: var(--k-text); font: 400 13px/1.4 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1;
  text-align: left; user-select: none;
}
.kf i { font-style: normal; }
.kf-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 14px; }
.kf-kind {
  display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; white-space: nowrap;
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #686a72;
}
.kf-ico { font-size: 11px; letter-spacing: 0; color: var(--k-dim); line-height: 1; }
.kf-kl { overflow: hidden; text-overflow: ellipsis; }
.kf-st { display: inline-flex; align-items: center; gap: 7px; flex: none; font-size: 11px; font-weight: 500; color: var(--k-dim); white-space: nowrap; }

.sdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--k-faint); flex: none; }
.st-needs-you .sdot { background: var(--k-amber); box-shadow: 0 0 6px rgba(255,181,71,.65); }
.st-active .sdot { background: var(--k-teal); }
.st-waiting .sdot { background: #8b93a7; }
.st-failed .sdot, .h-bad .sdot { background: var(--k-red); box-shadow: 0 0 6px rgba(239,107,107,.5); }
.st-proposed .sdot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--k-amber); }
.st-done .sdot, .st-parked .sdot { background: #4c4f57; }
.h-ok .sdot { background: var(--k-teal); }
.kf-st.st-needs-you { color: #e8c48c; }
.kf-st.st-failed, .kf-st.h-bad { color: #f0a3a3; }

.kf-main { display: flex; gap: 12px; align-items: flex-start; margin-top: 11px; min-width: 0; }
.kf-text { flex: 1; min-width: 0; }
.kf-title { display: flex; align-items: baseline; gap: 7px; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; }
.kf-tt { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.kf-tico, .kf-cdot { display: none; }
.kf-line { margin-top: 5px; color: var(--k-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kf-extra { display: none; margin-top: 8px; color: var(--k-muted); line-height: 1.45; }
.kf-extra > * { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; }
.kf-foot { margin-top: auto; padding-top: 9px; font-size: 11.5px; color: var(--k-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kf .sep { color: #4c4f57; }

.due.late { color: #f0a3a3; } .due.soon { color: #e8c48c; } .due.far { color: var(--k-muted); }
.prio { display: inline-flex; align-items: center; gap: 5px; }
.pdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--k-faint); }
.prio.p1 .pdot { background: var(--k-amber); } .prio.p2 .pdot { background: #b99566; }
.origin { color: var(--k-dim); }

.kf-project .kf-ico, .kb-project .kb-lead { --pc-fallback: #5a5d66; }
.kf-project .kf-ico { color: var(--pc, var(--k-dim)); font-size: 10px; }
.kf-next { color: #c9cad0; }
.kf-goal { color: #c9cad0; }

.kf-light { flex: none; display: inline-block; width: 9px; height: 9px; margin: 5px 1px 0; border-radius: 50%; background: #4c4f57; }
.kf-light.h-ok { background: var(--k-teal); box-shadow: 0 0 8px rgba(90,209,195,.55); }
.kf-light.h-bad { background: var(--k-red); box-shadow: 0 0 8px rgba(239,107,107,.6); animation: k-throb 2.4s var(--k-ease) infinite; }
.kf-extra > .kf-err { display: block; padding: 7px 10px; border-radius: 8px; background: rgba(239,107,107,.08); border-left: 2px solid rgba(239,107,107,.7);
  color: #efb9b9; font-family: var(--k-mono); font-size: 11.5px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.kf-badges { display: inline-flex; gap: 5px; flex: none; }
.kf-badge {
  display: inline-flex; align-items: center; padding: 1px 7px 2px; border-radius: 999px; white-space: nowrap;
  font-size: 10.5px; font-weight: 600; letter-spacing: .01em; color: #c9cad0; border: 1px solid #3a3d45;
}
.kf-badge.hot { color: var(--k-amber); background: rgba(255,181,71,.12); border-color: rgba(255,181,71,.42); }

.kf-st.live { color: var(--k-teal); }
.live-t { color: var(--k-teal); }
.pulse { position: relative; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--k-teal); flex: none; }
.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--k-teal); animation: k-ping 1.9s var(--k-ease) infinite; }
.kf-quote b { color: var(--k-amber); font-weight: 600; margin-right: 4px; }
.kf-reply { color: var(--k-dim); }

.kf-thumb { position: relative; flex: none; width: 92px; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #0c0d10; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
.kf-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.kf-play { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: grid; place-items: center; border-radius: 50%; background: rgba(16,17,20,.62); color: var(--k-text); font-size: 8px; padding-left: 2px; backdrop-filter: blur(2px); }
.kf-dur { position: absolute; right: 4px; bottom: 3px; padding: 0 4px; border-radius: 4px; background: rgba(0,0,0,.6); font-size: 10px; font-weight: 600; color: #ddd; }

.kf-verse { white-space: pre-line; font-style: italic; color: #c9cad0; }

/* the one guy suggests: dashed amber edge, his warm voice */
.kc-proposal { border-style: dashed !important; border-color: rgba(255,181,71,.38) !important; }
.kf-proposal .kf-kl { color: #c79a5a; letter-spacing: .08em; }
.kf-proposal .kf-tt { color: #ffe6c2; }
.kf-proposal .kf-line { color: #d6b58a; }
.kf-proposal .kf-st { color: #c79a5a; }
.orbdot {
  display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; vertical-align: -1px;
  background: radial-gradient(circle at 38% 34%, #fff1d6 0%, #ffd08a 24%, #ffb547 58%, #f29a2a 100%);
  box-shadow: 0 0 8px rgba(255,181,71,.7), 0 0 18px rgba(255,181,71,.25);
  animation: k-bob 3.2s ease-in-out infinite;
}

/* ---------- sizes ---------- */
/* hero: more room — title 3 lines, line wraps, extra visible */
[data-size="hero"] > .kf .kf-title { font-size: 17px; letter-spacing: -.01em; }
[data-size="hero"] > .kf .kf-tt { -webkit-line-clamp: 3; }
[data-size="hero"] > .kf .kf-line.prose { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
[data-size="hero"] > .kf .kf-extra { display: block; }
[data-size="hero"] > .kf-media .kf-main { flex-direction: column; gap: 12px; }
[data-size="hero"] > .kf-media .kf-thumb { width: 100%; border-radius: 10px; }
[data-size="hero"] > .kf-media .kf-play { width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 13px; }

/* card: prose summaries get two lines; media poster becomes a banner strip */
[data-size="card"] > .kf .kf-line.prose { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
[data-size="card"] > .kf-media .kf-main { flex-direction: column; gap: 10px; }
[data-size="card"] > .kf-media .kf-thumb { width: 100%; aspect-ratio: auto; height: 72px; }
[data-size="card"] > .kf-media .kf-tt { -webkit-line-clamp: 1; }
[data-size="card"] > .kf-crew .kf-badge:not(.hot) { display: none; }

/* compact: no top row, one-line title with a status dot, one line of meta */
[data-size="compact"] > .kf .kf-top { display: none; }
[data-size="compact"] > .kf .kf-main { margin-top: 0; gap: 10px; align-items: center; }
[data-size="compact"] > .kf .kf-title { font-size: 14px; }
[data-size="compact"] > .kf .kf-tt { -webkit-line-clamp: 1; }
[data-size="compact"] > .kf .kf-cdot { display: inline-block; margin-left: auto; align-self: center; }
[data-size="compact"] > .kf .kf-line { font-size: 12.5px; margin-top: 3px; }
[data-size="compact"] > .kf .kf-foot { display: none; }
[data-size="compact"] > .kf .kf-thumb { width: 56px; border-radius: 6px; }
[data-size="compact"] > .kf .kf-thumb .kf-play, [data-size="compact"] > .kf .kf-dur { display: none; }
[data-size="compact"] > .kf .kf-light { margin-top: 0; }
[data-size="compact"] > .kf-job .kf-cdot { display: none; }   /* the health light already sits on the left */

/* chip: a single line — glyph, title, status dot */
[data-size="chip"] > .kf { justify-content: center; }
[data-size="chip"] > .kf .kf-top, [data-size="chip"] > .kf .kf-line, [data-size="chip"] > .kf .kf-foot,
[data-size="chip"] > .kf .kf-extra, [data-size="chip"] > .kf .kf-thumb, [data-size="chip"] > .kf .kf-light { display: none; }
[data-size="chip"] > .kf .kf-main { margin: 0; }
[data-size="chip"] > .kf .kf-title { font-size: 13px; font-weight: 500; gap: 8px; align-items: center; }
[data-size="chip"] > .kf .kf-tt { display: block; white-space: nowrap; text-overflow: ellipsis; }
[data-size="chip"] > .kf .kf-tico { display: inline-block; flex: none; font-size: 11px; color: var(--k-dim); }
[data-size="chip"] > .kf-project .kf-tico { color: var(--pc, var(--k-dim)); }
[data-size="chip"] > .kf .kf-cdot { display: inline-block; margin-left: auto; }
[data-size="chip"].kc-proposal { border-radius: 999px; }

/* ================= bloom bodies ================= */
.kb {
  container-type: inline-size;
  display: flex; flex-direction: column; gap: 24px; min-width: 0;
  color: var(--k-text); font: 400 14px/1.55 Inter, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1;
}
.kb i { font-style: normal; }
.kb > *, .kb-grid > * { animation: kb-in .55s var(--k-ease) both; animation-delay: calc(var(--i, 0) * 70ms + 60ms); }
.kb p { margin: 0; }
.kb-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
@container (min-width: 620px) { .kb-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.kb-sec { min-width: 0; }
.kb-h { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #80838b; }
.kb-big { font-size: 20px; font-weight: 500; line-height: 1.42; letter-spacing: -.012em; overflow-wrap: anywhere; }
.kb-sub { color: var(--k-muted); font-size: 13px; }
.kb-chip { display: inline-flex; align-items: center; padding: 2px 10px 3px; border-radius: 999px; border: 1px solid var(--k-edge2); font-size: 12px; font-weight: 500; color: #c9cad0; }
.kb-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; align-items: baseline; }
.kb-kv dt { color: #80838b; font-size: 12.5px; }
.kb-kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kb-note { margin-top: 10px !important; color: var(--k-dim); font-size: 12.5px; }
.kb .muted { color: var(--k-dim); }
.kb .mono, .kb pre { font-family: var(--k-mono); font-size: 12.5px; }
.kb-a { color: var(--k-teal); text-decoration: none; border-bottom: 1px solid rgba(90,209,195,.3); transition: border-color .3s var(--k-ease); overflow-wrap: anywhere; }
.kb-a:hover { border-bottom-color: var(--k-teal); }
.kb-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.kb-tag { color: var(--k-dim); }
.kf .kb-tags { display: inline; }
.kb-quiet { opacity: .8; }

/* mini cards (a project's pieces) */
.kb-links, .kb-lane { display: flex; flex-wrap: wrap; gap: 8px; }
.kb-mini {
  display: inline-flex; align-items: center; gap: 9px; max-width: 100%; min-width: 0; padding: 8px 12px;
  border-radius: 10px; border: 1px solid var(--k-edge); background: rgba(255,255,255,.025);
  color: var(--k-text); font: 500 13px/1.3 Inter, system-ui, sans-serif; text-align: left; cursor: pointer;
  transition: border-color .3s var(--k-ease), transform .35s var(--k-spring), background-color .3s var(--k-ease);
}
.kb-mini:hover { border-color: rgba(90,209,195,.55); background: rgba(90,209,195,.05); transform: translateY(-1px); }
.kb-mini:focus-visible { outline: 2px solid var(--k-teal); outline-offset: 2px; }
.kb-mini-ico { color: var(--k-dim); font-size: 11px; flex: none; }
.kb-mini-t { min-width: 0; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-mini.missing { cursor: default; color: var(--k-muted); background: transparent; }
.kb-mini.missing:hover { transform: none; border-color: var(--k-edge); background: transparent; }
.kb-lane { align-items: stretch; }
.kb-mini.lane { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; min-width: 170px; min-height: 58px; padding: 9px 14px 10px; border-radius: 12px; }
.kb-mini-k { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--k-faint); }
.kb-mini.lane.st-needs-you .kb-mini-k { color: #c79a5a; }
.kb-mini.lane .kb-mini-t { font-size: 13.5px; max-width: 30ch; }

/* the empty "next" slot pulsing amber (the-song's bridge slot) */
.kb-slot {
  display: inline-flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 170px; min-height: 58px; max-width: 100%;
  padding: 9px 14px 10px; border-radius: 12px; border: 1px dashed var(--k-edge2); background: rgba(21,23,27,.9);
}
.kb-slot .sn { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--k-faint); }
.kb-slot-t { font-size: 13.5px; color: var(--k-muted); overflow-wrap: anywhere; }
.kb-slot.next { border: 1px solid rgba(255,181,71,.6); animation: k-slot 2.6s ease-in-out infinite; }
.kb-slot.next .sn { color: var(--k-amber); }
.kb-slot.next .kb-slot-t { color: var(--k-warm); }

/* project / goal lead */
.kb-project .kb-lead, .kb-goal .kb-lead { padding-left: 16px; border-left: 3px solid var(--pc, #3a3d45); }
.kb-goal .kb-lead { border-left-color: rgba(255,181,71,.55); }

/* evidence + quotes */
.kb-evidence, .kb-quotes, .kb-files { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.kb-evidence li { padding-left: 14px; position: relative; color: #d4d5da; }
.kb-evidence li::before { content: ""; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--k-teal); }
.kb-src {
  display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 6px; vertical-align: 1px;
  font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--k-teal); border: 1px solid rgba(90,209,195,.32);
}
.kb q { quotes: "\201C" "\201D"; }
.kb-quote { padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.025); border: 1px solid var(--k-edge); }
.kb-quote q { font-style: italic; color: #e2e2e6; }
.kb-ref { display: block; margin-top: 6px; }

/* the one guy's voice (proposal bloom) */
.kb-guy { display: flex; gap: 14px; align-items: flex-start; }
.kb-guy > .orbdot { width: 16px; height: 16px; margin-top: 6px; }
.kb-voice { font-size: 19px; font-weight: 500; line-height: 1.45; color: var(--k-warm); letter-spacing: -.008em; }
.kb-guy .kb-sub { margin-top: 8px; color: #b8956a; }
.kb-draft { margin: 0; padding: 14px 16px; border-radius: 12px; background: #121317; border: 1px dashed rgba(255,181,71,.38); white-space: pre-wrap; overflow-wrap: anywhere; color: #e6e3dc; }
pre.kb-draft { font-size: 13px; line-height: 1.6; }

/* tiny markdown */
.kb-md { line-height: 1.6; color: #d9d9dd; overflow-wrap: anywhere; }
.kb-md > * + * { margin-top: .7em; }
.kb-md p, .kb-md ul, .kb-md ol, .kb-md blockquote, .kb-md pre { margin: 0; }
.kb-md ul, .kb-md ol { padding-left: 1.3em; }
.kb-md li + li { margin-top: .3em; }
.kb-md .md-tasks { list-style: none; padding-left: 0; }
.kb-md .md-tasks li { display: flex; gap: 10px; align-items: baseline; }
.kb-md .md-box { flex: none; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid #5a5d66; transform: translateY(2px); font-size: 10px; color: #101114; }
.kb-md .md-tasks li.done .md-box { background: var(--k-teal); border-color: var(--k-teal); }
.kb-md .md-tasks li.done > span:last-child { color: var(--k-dim); text-decoration: line-through; }
.kb-md code { font-family: var(--k-mono); font-size: .9em; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,.06); }
.kb-md pre { padding: 12px 14px; border-radius: 10px; background: #0d0e11; border: 1px solid var(--k-edge); overflow-x: auto; }
.kb-md pre code { padding: 0; background: none; }
.kb-md blockquote { padding-left: 12px; border-left: 2px solid rgba(90,209,195,.5); color: var(--k-muted); }
.kb-md a { color: var(--k-teal); text-decoration: none; border-bottom: 1px solid rgba(90,209,195,.3); }
.kb-md .md-h { margin: 1em 0 .2em; font-size: 15px; font-weight: 600; color: var(--k-text); }

/* stats tiles (session, job) */
.kb-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@container (min-width: 620px) { .kb-stats { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } }
.kb-stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--k-edge); background: rgba(255,255,255,.02); }
.kb-num { display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.45; overflow-wrap: anywhere; }
.kb-num.sm { font-size: 17px; font-weight: 500; }
.kb-num.live { color: var(--k-teal); }
.kb-num.h-bad { color: #f0a3a3; } .kb-num.h-ok { color: var(--k-teal); }
.kb-num .kf-light { margin: 0; }
.kb-cap { font-size: 12px; color: var(--k-faint); }

/* session thread excerpt */
.kb-thread { display: flex; flex-direction: column; gap: 12px; }
.kb-msg { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.kb-msg .who { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--k-faint); text-align: right; }
.kb-msg.j .who { color: var(--k-amber); }
.kb-msg p { white-space: pre-wrap; overflow-wrap: anywhere; }
.kb-msg.j p { color: var(--k-text); font-size: 15px; }
.kb-msg.a p { color: #c9cad0; padding-left: 12px; border-left: 2px solid rgba(90,209,195,.55); }

/* buttons */
.kb-btn {
  display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 11px; cursor: pointer;
  font: 600 14px/1.2 Inter, system-ui, sans-serif; color: var(--k-text); background: rgba(255,255,255,.04); border: 1px solid var(--k-edge2);
  transition: background-color .3s var(--k-ease), border-color .3s var(--k-ease), transform .35s var(--k-spring);
}
.kb-btn:hover { transform: translateY(-1px); }
.kb-btn:focus-visible { outline: 2px solid var(--k-teal); outline-offset: 2px; }

/* job */
.kb-out { margin: 0; padding: 12px 14px; border-radius: 10px; background: #0d0e11; border: 1px solid var(--k-edge); white-space: pre-wrap; overflow-wrap: anywhere; color: #cfd0d4; line-height: 1.6; }
.kb-out.h-bad { border-left: 2px solid var(--k-red); color: #f2c0c0; }

/* media */
.kb-media { margin: 0; }
.kb-video { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 62vh; border-radius: 12px; background: #000; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
.kb-video.empty { display: grid; place-items: center; color: var(--k-faint); }
.kb-media-meta { margin-top: -10px; justify-content: space-between; }
.kb-files li { display: flex; gap: 8px; }

/* note */
.kb-paper {
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 19px; line-height: 1.7; font-style: italic; color: #e6e3dc;
  padding: 18px 22px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid var(--k-edge);
}

.kb-decide { margin-top: -8px !important; padding: 10px 14px; border-radius: 10px; background: rgba(255,181,71,.05); border: 1px solid rgba(255,181,71,.14); color: #c9b08a !important; }
.kb-code { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(255,255,255,.05); border: 1px solid var(--k-edge); font-family: var(--k-mono); font-size: 12.5px; color: var(--k-muted); }
@container (max-width: 520px) { .kb-stats.n3 > :first-child { grid-column: 1 / -1; } }

/* ================= motion ================= */
@keyframes kb-in { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes k-ping { 0% { transform: scale(1); opacity: .8; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
@keyframes k-throb { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes k-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes k-slot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,181,71,0); border-color: rgba(255,181,71,.45); }
  50% { box-shadow: 0 0 16px 0 rgba(255,181,71,.28); border-color: rgba(255,181,71,.95); }
}
@media (prefers-reduced-motion: reduce) {
  .kb > *, .kb-grid > *, .pulse::after, .orbdot, .kf-light.h-bad, .kb-slot.next { animation: none !important; }
}

/* ================= phone: nothing under 15px ================= */
@media (max-width: 600px) {
  .kf, .kf-line, .kf-st, .kf-foot, .kf-kind, .kf-ico, .kf-tico, .kf-badge, .kf-err, .kf-extra,
  .kb, .kb-sub, .kb-chip, .kb-kv dt, .kb-note, .kb .mono, .kb pre, .kb-mini, .kb-mini-ico, .kb-slot .sn, .kb-slot-t,
  .kb-src, .kb-cap, .kb-msg .who, .kb-btn, .kb-md .md-box, .kb-md code, pre.kb-draft, .kf-dur, .kf-play,
  .kb-mini-k, .kb-mini.lane .kb-mini-t, .kb-code {
    font-size: 15px;
  }
  .kf-kind { letter-spacing: .06em; }
  .kf-kl { display: none; }            /* the glyph carries the kind on a phone */
  .kf-proposal .kf-kl { display: inline; text-transform: none; letter-spacing: 0; }
  .kf-extra > .kf-err { font-size: 15px; }
  .kf-title { font-size: 17px; }
  [data-size="compact"] > .kf .kf-title { font-size: 16px; }
  [data-size="compact"] > .kf .kf-line { font-size: 15px; }
  [data-size="chip"] > .kf .kf-title { font-size: 15px; }
  [data-size="chip"] > .kf .kf-tico { font-size: 15px; }
  [data-size="hero"] > .kf .kf-title { font-size: 19px; }
  .kf-thumb { width: 104px; }
  .kf-dur, .kf-play { display: none !important; }
  [data-size="hero"] > .kf-media .kf-play { display: grid !important; font-size: 15px; }
  .kf-project .kf-ico { font-size: 15px; }
  .kb-h { font-size: 15px; letter-spacing: .02em; text-transform: none; color: var(--k-dim); }
  .kb-big { font-size: 20px; }
  .kb-num.sm, .kb-num.live { font-size: 17px; }
  .kb-msg { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .kb-msg .who { text-align: left; letter-spacing: .04em; }
  .kb-msg.j p { font-size: 16px; }
  .kb-mini-t { max-width: 100%; }
  .kb-slot { min-width: 0; width: 100%; }
  .kb-kv { grid-template-columns: minmax(0, 1fr); gap: 2px 0; }
  .kb-kv dd { margin-bottom: 8px; }
  .kb-src { letter-spacing: .03em; text-transform: none; }
}

/* ================= v1.1 (WS-K): plain words, decision first ================= */
.kc-brief, .kb { --k-warm2: #f3d3a4; }

/* kicker */
.kb-kicker { display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: #d6b58a; letter-spacing: .01em; }
.kb-kicker .orbdot { width: 12px; height: 12px; }

/* one-line callouts (crew's ask, a question in the raw text) */
.kb-callout { padding: 14px 16px; border-radius: 14px; font-size: 16px; line-height: 1.5; color: #e2d2b8;
  background: rgba(255,181,71,.06); border: 1px solid rgba(255,181,71,.2); }
.kb-callout b { color: var(--k-warm); font-weight: 600; }
.kb-callout .kb-verbs { color: var(--k-warm); font-weight: 600; }
.kb-callout.done { color: #bfe9e3; background: rgba(90,209,195,.06); border-color: rgba(90,209,195,.25); }
.kb-when { display: flex; flex-wrap: wrap; gap: 8px; }
.kb-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--k-edge2); font-size: 14px; font-weight: 500; }
.kb-plain { font-size: 16px; line-height: 1.5; color: #dcdce0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kb-plain .kf-light { margin: 0; transform: translateY(-1px); }
.kb-cap2 { margin: 14px 0 6px !important; font-size: 12.5px; color: var(--k-faint); }
.kb-broke .kb-h { color: #e59a9a; }
.kb-broke .kb-plain { color: #f0c9c9; }
.kb-voice.sm { font-size: 16px; }
.kb-raw { font-size: 15px; line-height: 1.55; color: #d4d5da; overflow-wrap: anywhere; white-space: pre-wrap; }

/* behind this: everything raw (focus.js moves it into its own "behind this" fold) */
.kb-behind { display: flex; flex-direction: column; gap: 22px; padding-top: 12px; border-top: 1px solid #24262c; }

/* faces: due countdown in the status slot */
.kf-st.due-st .due { font-weight: 600; }

/* ---------- 'for you' face: bigger, warmer, his words ---------- */
.kc-brief { border-color: rgba(255,181,71,.28) !important; background: linear-gradient(180deg, #211f1c, #1b1d22 70%) !important; }
.kc-brief.kc-proposal { border-style: dashed !important; }
.kc-brief.kc-st-failed { border-color: rgba(239,107,107,.38) !important; background: linear-gradient(180deg, #231c1d, #1b1d22 70%) !important; }
.kfb { gap: 0; }
.kfb-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 16px; }
.kfb-k { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-size: 12.5px; font-weight: 600; color: #d6b58a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kfb-k .kf-ico { color: #d6b58a; font-size: 12px; }
.kfb-k .orbdot { width: 10px; height: 10px; }
.kc-st-failed .kfb-k, .kc-st-failed .kfb-k .kf-ico { color: #e59a9a; }
.kfb-media { margin-top: 12px; }
.kfb-media .kf-thumb { width: 100%; border-radius: 10px; }
.kfb-media .kf-play { width: 40px; height: 40px; margin: -20px 0 0 -20px; font-size: 13px; }
[data-size] > .kfb .kfb-title { display: -webkit-box; -webkit-line-clamp: 3; white-space: normal; margin-top: 12px;
  font-size: 21px; font-weight: 600; line-height: 1.25; letter-spacing: -.015em; color: #f5f1ea; }
.kfb-why { margin: 8px 0 0; font-size: 15px; line-height: 1.45; color: #bdbec4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
[data-size="chip"] > .kfb .kfb-why, [data-size="chip"] > .kfb .kfb-media { display: none; }

@media (max-width: 600px) {
  .kb-kicker, .kb-cap2, .kb-pill, .kfb-k, .kfb-k .kf-ico, .kb-raw { font-size: 15px; }
  .kfb-why { font-size: 16px; }
  [data-size] > .kfb .kfb-title { font-size: 22px; }
}
.kb-fix b { color: var(--k-text); font-weight: 600; }

/* ---------- live work (phase3): teal = live / work in progress (A4 L7) ----------
   live.js adds .og-live + an edge and one status line to any card whose key has a live
   event on /api/feed. The edge is its own element so it never fights the focus ring or the
   needs-you amber bar (both live on the card's own border/::before). */
.og-live { --og-live: 90, 209, 195; }
.og-live-edge { position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; z-index: 0;
  border: 1px solid rgba(var(--og-live), .55); animation: og-breathe 2.8s ease-in-out infinite; }
@keyframes og-breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(var(--og-live), 0), inset 0 0 0 0 rgba(var(--og-live), 0); border-color: rgba(var(--og-live), .35); }
  50% { box-shadow: 0 0 22px 1px rgba(var(--og-live), .26), inset 0 0 14px rgba(var(--og-live), .06); border-color: rgba(var(--og-live), .85); }
}
.og-live.og-live-quiet .og-live-edge { animation: none; border-color: rgba(var(--og-live), .25); border-style: dashed; }
.og-live-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; font-size: 12.5px; line-height: 1.3;
  color: rgb(var(--og-live)); position: relative; z-index: 1; }
.og-live-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
.og-live-dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--og-live));
  animation: og-live-ping 1.8s ease-out infinite; }
@keyframes og-live-ping { 0% { box-shadow: 0 0 0 0 rgba(var(--og-live), .55); } 100% { box-shadow: 0 0 0 8px rgba(var(--og-live), 0); } }
.og-live-quiet .og-live-line { color: #8a8d94; }
.og-live-quiet .og-live-dot { background: #8a8d94; animation: none; }
.og-live-open { margin-left: auto; flex: none; color: rgba(var(--og-live), .9); text-decoration: none; font-size: 12px;
  border: 1px solid rgba(var(--og-live), .3); border-radius: 7px; padding: 3px 7px; white-space: nowrap; }
.og-live-open:hover, .og-live-open:focus-visible { color: #e9fffb; border-color: rgb(var(--og-live)); outline: none; }
/* briefing cards: the line sits in flow at the bottom */
.og-fy .og-live-line { margin-top: auto; padding-top: 6px; }
/* canvas cards: a thin strip over the foot, so the card never grows under the user's layout */
.og-card .og-live-line { position: absolute; left: 12px; right: 12px; bottom: 8px; padding: 4px 0 0;
  background: linear-gradient(transparent, var(--card, #1a1c21) 30%); }
.og-card[data-size="compact"] .og-live-open, .og-card[data-size="dot"] .og-live-line { display: none; }
/* the header's working count links to the runs page (one quiet place, no ticker: L4) */
#og-sum a.og-working { color: rgb(90, 209, 195); text-decoration: none; }
#og-sum a.og-working:hover { text-decoration: underline; }
#og-sum a.og-working + span::before, #og-sum span + a.og-working::before { content: "·"; margin: 0 8px; color: #4c4f57; }
@media (prefers-reduced-motion: reduce) {
  .og-live-edge, .og-live-dot { animation: none; }
  .og-live-edge { box-shadow: 0 0 14px rgba(var(--og-live), .2); border-color: rgba(var(--og-live), .7); }
}

/* ================= widget: the housekeeping glance (lab glance.html) ================= */
/* The card IS the glance: one label, one number, one next thing. */
.kg { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; column-gap: 12px;
  width: 100%; height: 100%; min-width: 0; color: var(--k-text); text-align: left; }
.kg-top { grid-column: 1 / -1; display: flex; align-items: center; gap: 7px;
  font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #686a72; }
.kg-top .kf-ico { color: var(--k-dim); }
.kg-n { grid-row: 2; align-self: center; font-size: 34px; font-weight: 600; letter-spacing: -.03em;
  font-feature-settings: "tnum" 1; transition: transform 400ms var(--k-spring), color 300ms; }
.kg-n.bump { animation: kg-bump 600ms var(--k-spring); }
@keyframes kg-bump { 40% { transform: scale(1.3); color: var(--k-teal); } }
.kg-next { grid-row: 2; align-self: end; font-size: 13px; line-height: 1.35; color: var(--k-text);
  min-width: 0; overflow: hidden; }
.kg-next small { display: block; color: var(--k-dim); font-size: 12px; }
.kg-unwired .kg-n { color: var(--k-faint); }
.kg-unwired .kg-next { color: var(--k-dim); font-size: 12px; }

/* the bloom: the workable surface */
.kg-rows .kg-row { display: flex; gap: 12px; align-items: center; padding: 11px 4px; border-top: 1px solid var(--k-edge); }
.kg-row:first-child { border-top: 0; }
.kg-row { cursor: pointer; border-radius: 10px; } .kg-row:hover { background: rgba(255,255,255,.04); }
.kg-box { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #5a5e68; flex: none;
  display: grid; place-items: center; font-size: 12px; color: #0b2420; background: none; padding: 0;
  cursor: pointer; transition: all 300ms var(--k-spring); }
.kg-row:hover .kg-box { border-color: var(--k-teal); background: rgba(90,209,195,.12); }
.kg-row.done .kg-box { background: var(--k-teal); border-color: var(--k-teal); }
.kg-row.done .kg-t { color: var(--k-faint); text-decoration: line-through; }
.kg-t { flex: 1; min-width: 0; }
.kg-m { font-size: 12px; color: var(--k-faint); flex: none; }

/* plugin tiles: one of the user's plugin surfaces under project:hermes (exp/plugin-tiles) */
.kp { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.kp-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.kp-name .kf-ico { font-style: normal; color: var(--k-dim); }
.kp-what { margin: 0; font-size: 13px; line-height: 1.4; color: var(--k-text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kp-foot { margin-top: auto; font-size: 12px; color: var(--k-dim); }
.kp-hint { color: var(--k-faint); }
.kp-hint { display: inline-block; border: 1px dashed rgba(255,255,255,.18); border-radius: 999px;
  padding: 4px 12px; color: var(--k-faint); }

/* email + calendar tiles from the user's own Hermes (widget.js digestCard / digestBloom) */
.kg-offer .kg-next small, .kg-waiting .kg-next small { color: var(--k-text); }
.kg-row.kg-row-ro { cursor: default; } .kg-row.kg-row-ro:hover { background: none; }
.kg-row-ro .kg-t b { font-weight: 600; margin-right: 6px; }
.kg-row-ro .kg-m { margin-left: auto; white-space: nowrap; color: var(--k-dim); font-size: 12px; }
.kg-say { font-size: 16px; color: var(--k-text); }
p.kg-offer { display: flex; gap: 10px; margin: 14px 0 0; }
.kb-btn[disabled] { opacity: .5; cursor: default; }

/* the inbox as next actions: a row opens in place, one at a time; no checkboxes (widget.js mailBloom) */
.kg-mails .kg-mail { border-top: 1px solid var(--k-edge); }
.kg-mails .kg-mail:first-child { border-top: 0; }
.kg-mail-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; width: 100%; padding: 11px 6px;
  background: none; border: 0; border-radius: 10px; color: var(--k-text); font: inherit; text-align: left; cursor: pointer; }
.kg-mail-h:hover { background: rgba(255,255,255,.04); }
.kg-mail-h:focus-visible { outline: 2px solid var(--k-teal); outline-offset: -2px; }
.kg-mail-from { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-mail-h .kg-m { grid-column: 2; grid-row: 1; white-space: nowrap; color: var(--k-dim); }
.kg-mail-subj { grid-column: 1 / -1; min-width: 0; color: var(--k-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kg-mail-auto .kg-mail-from { font-weight: 500; color: var(--k-dim); }
.kg-mail-open .kg-mail-h { background: rgba(255,255,255,.04); border-radius: 10px 10px 0 0; }
.kg-mail-open .kg-mail-subj { display: none; }
.kg-mail-b { padding: 4px 8px 14px; background: rgba(255,255,255,.04); border-radius: 0 0 10px 10px; }
.kg-mail-b p { margin: 6px 0 0; }
.kg-mail-who { font-size: 12.5px; color: var(--k-dim); }
.kg-mail-who b { color: var(--k-text); font-weight: 600; }
.kg-mail-wait { color: #d6b58a; }
.kg-mail-s { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.kg-mail-snip { font-size: 13.5px; line-height: 1.5; color: var(--k-text); opacity: .86; overflow-wrap: anywhere; }
p.kg-mail-verbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.kg-mail-sep { padding: 14px 6px 6px; font-size: 12px; color: var(--k-faint); border-top: 1px solid var(--k-edge); }
@media (max-width: 480px) { .kg-mail-verbs .kb-btn { padding: 9px 12px; } }

/* home/stage.css */
/* 1guy home · the stage (Phase 4, "show me"). Owned by stage.js, loaded by it.
   Desktop: a large panel over the canvas, which dims. Phone: a full sheet. Sits under the
   talk bar (z 40) so the bar can talk "about:" what's on it; over the rail, cards and bloom. */
.og-stage-scrim { position: fixed; inset: 0; z-index: 37; background: rgba(8, 9, 11, .66); backdrop-filter: blur(2px) saturate(.8);
  opacity: 0; pointer-events: none; transition: opacity 380ms cubic-bezier(.22,.8,.24,1); }
.og-stage-scrim.on { opacity: 1; pointer-events: auto; }
body.og-staged #og-stage, body.og-staged #og-brief { filter: brightness(.8); transition: filter 380ms; }

.og-stage { position: fixed; z-index: 38; left: 50%; top: calc(64px + var(--og-sat, 0px)); bottom: calc(86px + var(--og-sab, 0px));
  width: min(1120px, calc(100vw - 64px)); transform: translateX(-50%);
  background: #15171b; color: #ecebe6; border: 1px solid #33363e; border-radius: 20px;
  box-shadow: 0 40px 120px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 181, 71, .06);
  display: none; flex-direction: column; overflow: hidden; font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
.og-stage.on { display: flex; }
.og-stage-hd { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-bottom: 1px solid #2a2d34; flex: none; min-height: 52px; }
.og-stage-kind { font: 600 10px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #5ad1c3; border: 1px solid rgba(90, 209, 195, .35);
  padding: 4px 6px; border-radius: 5px; letter-spacing: .08em; text-transform: uppercase; flex: none; }
.og-stage-ttl { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
.og-stage-why { color: #a9aab0; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.og-stage-hd a, .og-stage-hd button { border: 0; background: none; color: #9a9ca3; font: 13px Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer;
  padding: 6px 8px; border-radius: 8px; flex: none; }
.og-stage-hd a:hover, .og-stage-hd button:hover { color: #ffd9a0; background: rgba(255, 255, 255, .04); }
.og-stage-hd .og-stage-x { font-size: 22px; line-height: 1; padding: 2px 8px 4px; }
.og-stage-shown-m { position: absolute; right: 54px; top: 50px; z-index: 3; min-width: 220px; max-width: 320px; padding: 6px; background: #1b1d22;
  border: 1px solid #33363e; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, .55); display: flex; flex-direction: column; gap: 2px; }
.og-stage-shown-m[hidden] { display: none; }
.og-stage-shown-m b { font: 600 10px/1 ui-monospace, monospace; letter-spacing: .12em; color: #80838b; text-transform: uppercase; padding: 8px 10px 6px; }
.og-stage-shown-m button { text-align: left; border: 0; background: none; color: #d9dadf; padding: 8px 10px; border-radius: 8px; font: 13px Inter, system-ui, sans-serif; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.og-stage-shown-m button:hover { background: #20232a; color: #ffd9a0; }
.og-stage-shown-m button small { color: #80838b; margin-right: 6px; font: 10px ui-monospace, monospace; text-transform: uppercase; }
.og-stage-shown-m button.held small { color: #ffb547; }
.og-stage-bd { flex: 1; overflow: auto; position: relative; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.og-stage-bd iframe { border: 0; width: 100%; height: 100%; display: block; background: #101114; }
.og-stage-msg { padding: 60px 30px; text-align: center; color: #a9aab0; font-size: 15px; }
.og-stage-msg a { color: #5ad1c3; }
.og-stage-msg .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5ad1c3; margin-right: 8px; animation: og-stage-pulse 1.2s ease-in-out infinite; }
@keyframes og-stage-pulse { 50% { opacity: .25; } }

/* reader view */
.og-reader { max-width: 680px; margin: 0 auto; padding: 40px 28px 70px; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 19px; line-height: 1.62; color: #e3e1da; }
.og-reader .src { font: 600 11px/1.4 Inter, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ffb547; }
.og-reader .src span { color: #80838b; }
.og-reader h1 { font-size: 36px; line-height: 1.12; margin: 14px 0 12px; letter-spacing: -.01em; color: #f4f2ea; font-weight: 600; }
.og-reader .gw { font: 15.5px/1.45 Inter, system-ui, sans-serif; color: #ffd9a0; border-left: 2px solid #ffb547; padding-left: 12px; margin: 18px 0 26px; }
.og-reader img.hero { width: 100%; border-radius: 12px; margin: 6px 0 22px; max-height: 380px; object-fit: cover; background: #1b1d22; }
.og-reader p { margin: 0 0 1.05em; }
.og-reader h2 { font-size: 24px; line-height: 1.2; margin: 1.4em 0 .5em; color: #f1ede2; }
.og-reader blockquote { margin: 1.2em 0; padding-left: 18px; border-left: 2px solid #33363e; color: #c9c6bd; font-style: italic; }
.og-reader ul { padding-left: 1.2em; margin: 0 0 1.05em; }
.og-reader pre { font: 13px/1.5 ui-monospace, monospace; background: #101114; padding: 12px 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
.og-reader .orig { display: inline-block; margin-top: 10px; font: 14px Inter, system-ui, sans-serif; color: #5ad1c3; }

/* chart */
.og-chart { padding: 30px 40px 30px; height: 100%; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; min-height: 320px; }
.og-chart .big { font-size: 40px; font-weight: 600; letter-spacing: -.03em; line-height: 1.05; }
.og-chart .note { color: #a9aab0; font-size: 15px; }
.og-chart svg { flex: 1; width: 100%; min-height: 200px; overflow: visible; }
.og-chart .legend { display: flex; gap: 16px; color: #a9aab0; font-size: 12.5px; flex-wrap: wrap; }
.og-chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.og-chart .bar { transform-origin: 50% 100%; transform-box: fill-box; animation: og-stage-grow 800ms cubic-bezier(.2,.9,.25,1.08) both; }
.og-chart .line { stroke-dasharray: 2000; stroke-dashoffset: 2000; animation: og-stage-draw 1100ms cubic-bezier(.22,.8,.24,1) forwards; }
@keyframes og-stage-grow { from { transform: scaleY(0); } }
@keyframes og-stage-draw { to { stroke-dashoffset: 0; } }

/* image */
.og-image { height: 100%; min-height: 300px; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #1d1a14, #101114 70%); }
.og-image img { max-height: 92%; max-width: 94%; border-radius: 10px; object-fit: contain; }

@media (max-width: 700px) {
  .og-stage { left: 0; right: 0; width: auto; transform: none; top: calc(10px + var(--og-sat, 0px)); bottom: 0; border-radius: 20px 20px 0 0;
    border-bottom: 0; padding-bottom: calc(78px + var(--og-sab, 0px)); }
  .og-stage::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px; border-radius: 2px; background: #33363e; }
  .og-stage-hd { padding-top: 16px; }
  .og-stage-why { display: none; }
  .og-stage-ttl { max-width: none; flex: 1; }
  .og-stage-shown-m { right: 10px; }
  .og-reader { font-size: 17.5px; padding: 24px 20px 50px; }
  .og-reader h1 { font-size: 27px; }
  .og-chart { padding: 20px 18px; }
  .og-chart .big { font-size: 30px; }
}
@media (prefers-reduced-motion: reduce) {
  .og-chart .bar, .og-chart .line { animation: none; stroke-dashoffset: 0; }
}

/* home/surface.css */
/* WS-F/T: work-surface thread (inside .bloom-thread, no composer) + the global talk bar (the one input). Look per home-contract. */
:root { --sf-amber: #ffb547; --sf-teal: #5ad1c3; --sf-ink: #101114; --sf-card: #1b1d22; --sf-line: #2a2d34; --sf-dim: #a9aab0; --sf-ease: cubic-bezier(.2, .9, .25, 1.12); }

.sf { display: flex; flex-direction: column; gap: 6px; min-height: 0; font-family: Inter, system-ui, sans-serif; color: #e7e7ea; }
.sf-hd { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7d7f86; min-width: 0; min-height: 0; }
.sf-hd:not(:has(> :not([hidden]):not(.sf-gap))) { display: none; }
.sf-gap { flex: 1; }
.sf-earlier { background: none; border: 0; padding: 2px 0; color: #7d7f86; font: 11px/1.2 Inter, system-ui, sans-serif; cursor: pointer; letter-spacing: .01em; }
.sf-earlier:hover { color: #d9dadf; }
.sf-open { font-size: 11px; color: #7d7f86; text-decoration: none; padding: 2px 0; white-space: nowrap; }
.sf-open:hover { color: var(--sf-teal); }
.sf-stop { background: none; border: 0; padding: 2px 0; color: var(--sf-amber); font: 11px/1.2 Inter, system-ui, sans-serif; cursor: pointer; }
.sf-hd [hidden] { display: none; }

.sf-turns { display: flex; flex-direction: column; gap: 6px; max-height: min(36vh, 320px); overflow-y: auto; padding: 2px 2px 2px; scroll-behavior: smooth; }
.sf-turn { font-size: 13px; line-height: 1.5; border-radius: 12px; padding: 6px 10px; max-width: 92%; animation: sf-in 320ms var(--sf-ease) both; overflow-wrap: anywhere; white-space: pre-wrap; }
.sf-turn.sf-seen, .sf-cut-seen .sf-unheard { animation: none; }
.sf-j { align-self: flex-end; background: #23262c; color: #f1f1f3; }
.sf-j.sf-kick { background: transparent; color: #a9aab0; border: 1px dashed var(--sf-line); }
.sf-guy { align-self: flex-start; background: transparent; color: #d9dadf; border: 1px solid var(--sf-line); }
.sf-guy.sf-live { border-color: rgba(255, 181, 71, .45); box-shadow: 0 0 0 3px rgba(255, 181, 71, .06); }
.sf-guy.sf-cut { border-style: dashed; }
.sf-queued { opacity: .72; }
.sf-caret { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: var(--sf-amber); box-shadow: 0 0 8px var(--sf-amber); vertical-align: middle; animation: sf-pulse 1.1s ease-in-out infinite; }
.sf-unheard { display: block; margin-top: 4px; color: #6f7178; text-decoration: line-through rgba(255, 181, 71, .5); animation: sf-split 900ms var(--sf-ease) both; }
.sf-mtag { display: inline-block; margin-left: 8px; font: 10px/1.2 Inter, system-ui, sans-serif; text-transform: lowercase; color: var(--sf-teal); opacity: .8; vertical-align: 1px; }
.sf-mtag-cut { color: var(--sf-amber); }
.sf-note, .sf-tools { display: block; font-size: 11px; color: #7d7f86; margin-top: 2px; }
.sf-note-lead { margin: 0 0 1px; font-size: 10px; letter-spacing: .04em; }
.sf-err { display: block; font-size: 11px; color: #ff7a6b; margin-top: 2px; }

/* the talk bar: THE one input, bottom-centre of the canvas (left of the rail), clear of the
   iPhone home indicator (env() directly: this sheet loads after home.css, so it decides) */
.tk-bar { display: flex; align-items: center; gap: 6px; border: 1px solid var(--sf-line); border-radius: 14px; padding: 5px 6px 5px 8px; transition: border-color 280ms var(--sf-ease), box-shadow 280ms var(--sf-ease); position: fixed; z-index: 40; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: calc((100vw - var(--og-rail-w, 260px)) / 2); transform: translateX(-50%); width: min(620px, calc(100vw - var(--og-rail-w, 260px) - 32px)); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); background: rgba(21, 23, 27, .94); backdrop-filter: blur(6px); box-sizing: border-box; }
.tk-bar:focus-within { border-color: rgba(255, 181, 71, .55); box-shadow: 0 0 0 3px rgba(255, 181, 71, .08), 0 10px 30px rgba(0, 0, 0, .35); }
.tk-input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #f1f1f3; font: 14px/1.4 Inter, system-ui, sans-serif; padding: 6px 2px; }
.tk-input::placeholder { color: #6f7178; }
.tk-bar.tk-focused { border-color: rgba(236, 235, 230, .32); }
.tk-bar.tk-focused:focus-within { border-color: rgba(236, 235, 230, .55); box-shadow: 0 0 0 3px rgba(236, 235, 230, .07), 0 10px 30px rgba(0, 0, 0, .35); }
.tk-about { flex: none; display: inline-flex; align-items: center; gap: 2px; max-width: 46%; font-size: 12px; color: var(--focus-ink, #f4f3ee); background: #23252b; border: 1px solid var(--focus-ring, rgba(236, 235, 230, .78)); box-shadow: 0 0 0 2px var(--focus-halo, rgba(236, 235, 230, .1)), 0 4px 12px rgba(0, 0, 0, .4); border-radius: 999px; padding: 2px 2px 2px 10px; animation: sf-in 320ms var(--sf-ease) both; }
.tk-about[hidden] { display: none; }
.tk-about-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-about-x { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: inherit; font: 15px/1 Inter, system-ui, sans-serif; cursor: pointer; opacity: .7; }
.tk-about-x:hover { opacity: 1; background: rgba(236, 235, 230, .12); }
/* the steer/queue tag: quiet, only while he's talking; tap flips it */
.sf-tag { flex: none; font: 10px/1 Inter, system-ui, sans-serif; letter-spacing: .03em; border-radius: 6px; padding: 4px 5px; cursor: pointer; background: none; border: 0; color: #7d7f86; opacity: .75; transition: color 260ms var(--sf-ease), opacity 260ms var(--sf-ease); }
.sf-tag[hidden] { display: none; }
.sf-tag:hover { opacity: 1; }
.sf-tag-steer, .sf-tag-queue { color: var(--sf-teal); }
.tk-stop, .tk-mic { flex: none; height: 30px; min-width: 30px; border-radius: 10px; border: 1px solid var(--sf-line); background: #1b1d22; color: #d9dadf; cursor: pointer; font: 12px/1 Inter, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; padding: 0 8px; }
.tk-stop { color: var(--sf-amber); }
.tk-stop[hidden] { display: none; }
.tk-mic:hover { border-color: rgba(255, 181, 71, .5); color: var(--sf-amber); }
.tk-mic.tk-rec { color: #101114; background: var(--sf-amber); border-color: var(--sf-amber); animation: sf-pulse 1.1s ease-in-out infinite; }
.tk-recording .tk-input::placeholder { color: var(--sf-amber); }

/* the reply strip: one calm line (his latest sentence) above the bar; tap → the whole reply */
.tk-reply { position: fixed; z-index: 39; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); left: calc((100vw - var(--og-rail-w, 260px)) / 2); transform: translateX(-50%); width: min(620px, calc(100vw - var(--og-rail-w, 260px) - 32px)); box-sizing: border-box; display: flex; align-items: baseline; gap: 8px; background: rgba(27, 29, 34, .96); border: 1px solid var(--sf-line); border-radius: 12px; padding: 7px 12px; font: 13px/1.45 Inter, system-ui, sans-serif; color: #d9dadf; cursor: pointer; animation: tk-in 320ms var(--sf-ease) both; }
.tk-reply[hidden] { display: none; }
.tk-reply .tk-said { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-reply.tk-open { display: block; max-height: 40vh; overflow-y: auto; cursor: zoom-out; }
.tk-reply.tk-open .tk-said { display: block; white-space: pre-wrap; overflow: visible; }
.tk-reply.tk-live { border-color: rgba(255, 181, 71, .4); }
.tk-reply.tk-cut { border-style: dashed; }
.tk-who { flex: none; font-size: 10px; letter-spacing: .06em; text-transform: lowercase; color: var(--sf-amber); max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-reply.tk-open .tk-who { display: block; max-width: none; margin-bottom: 3px; }

/* ---- Phase 2: the adaptive talk bar ---------------------------------- */
/* the guess glyph: ↗ card (command) / ▤ column (conversation); tap to flip */
.tk-glyph { flex: none; width: 26px; height: 30px; border: 0; background: none; color: var(--sf-teal); font: 14px/1 Inter, system-ui, sans-serif; cursor: pointer; opacity: .85; }
.tk-glyph[hidden] { display: none; }
.tk-glyph:hover { opacity: 1; }
.tk-glyph-flipped { color: var(--sf-amber); }
/* the sound toggle: five lab cues, OFF by default; nothing plays when off */
/* the fly-off chip */
.tk-fly { position: fixed; z-index: 70; transform: translate(-50%, 0); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: #20232a; border: 1px solid rgba(64, 205, 191, .55); color: #e9eae6; font: 12px/1.4 Inter, system-ui, sans-serif;
  border-radius: 999px; padding: 5px 12px; box-shadow: 0 8px 22px rgba(0, 0, 0, .45); pointer-events: none; }
/* landing: the target lights (a teal ring, L7's live colour, not focus ink) */
.og-land, .og-card.og-land { box-shadow: 0 0 0 2px rgba(64, 205, 191, .8), 0 0 18px rgba(64, 205, 191, .25) !important; transition: box-shadow 240ms var(--sf-ease); }
.og-confirm-ring { box-shadow: 0 0 0 2px rgba(255, 181, 71, .85), 0 0 20px rgba(255, 181, 71, .3) !important; }
/* tap-to-confirm pill on the lit target */
.tk-confirm { position: fixed; background: rgba(21, 23, 27, .96); border: 1px solid rgba(255, 181, 71, .65); color: #f1f1f3;
  font: 12px/1.3 Inter, system-ui, sans-serif; border-radius: 10px; padding: 7px 12px; cursor: pointer; box-shadow: 0 10px 26px rgba(0, 0, 0, .5); max-width: 300px; text-align: left; }
.tk-confirm:hover { border-color: var(--sf-amber); }
/* the undo pill: 5s, above the bar */
.tk-undo { position: fixed; z-index: 71; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: rgba(21, 23, 27, .96); border: 1px solid var(--sf-line); color: #d9dadf; font: 12px/1.3 Inter, system-ui, sans-serif;
  border-radius: 999px; padding: 6px 14px; cursor: pointer; box-shadow: 0 8px 22px rgba(0, 0, 0, .4); animation: tk-in 260ms var(--sf-ease) both; }
.tk-undo:hover { border-color: rgba(64, 205, 191, .6); color: #fff; }

/* ---- the column (fixed right, 420px; phone: full-height sheet) -------- */
:root { --og-col-w: 0px; }
.og-col { position: fixed; top: 0; right: 0; bottom: 0; width: var(--og-col-w); z-index: 38;
  display: flex; flex-direction: column; background: rgba(23, 25, 29, .97); border-left: 1px solid var(--sf-line);
  box-shadow: -18px 0 40px rgba(0, 0, 0, .35); transition: width 340ms var(--sf-ease); }
body:not(.og-col-open) .og-col { width: 0; overflow: hidden; border-left-color: transparent; }
.og-col.og-mobile { border-left: 0; width: 100vw; }
/* everything the canvas owns shifts left so the card docks at the column's edge (L2) */
body.og-col-open #og-stage, body.og-col-open #og-brief, body.og-col-open #og-backdrop,
body.og-col-open #og-tendrils { right: calc(var(--og-rail-w, 260px) + var(--og-col-w)); transition: right 340ms var(--sf-ease); }
body.og-col-open .tk-bar, body.og-col-open .tk-undo { left: calc((100vw - var(--og-rail-w, 260px) - var(--og-col-w)) / 2); transition: left 340ms var(--sf-ease); }
.og-col-hd { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--sf-line); }
.og-col-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #4a4c52; }
.og-col-streaming .og-col-dot { background: var(--sf-teal); animation: sf-pulse 1.2s ease-in-out infinite; }
.og-col-ttl { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 13px/1.3 Inter, system-ui, sans-serif; color: #f1f1f3; }
.og-col-why { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px/1.3 Inter, system-ui, sans-serif; color: #7d7f86; }
.og-col-stop, .og-col-x { flex: none; height: 28px; min-width: 28px; border-radius: 9px; border: 1px solid var(--sf-line); background: #1b1d22; color: #d9dadf; cursor: pointer; font: 12px/1 Inter, system-ui, sans-serif; }
.og-col-stop { color: var(--sf-amber); }
.og-col-stop[hidden] { display: none; }
.og-col-open { flex: none; font: 11px/1 Inter, system-ui, sans-serif; color: #9a9ca3; text-decoration: none; padding: 6px 4px; }
.og-col-open:hover { color: #e9eae6; }
.og-col-q { flex: none; margin: 10px 14px 0; border: 1px solid rgba(255, 181, 71, .5); border-radius: 12px; padding: 9px 12px; background: rgba(255, 181, 71, .07); }
.og-col-q-t { display: block; font: 13px/1.45 Inter, system-ui, sans-serif; color: #f4e9d8; }
.og-col-q-h { display: block; margin-top: 3px; font: 10px/1.3 Inter, system-ui, sans-serif; letter-spacing: .05em; color: #8f919a; }
.og-col-turns { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px calc(90px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.og-col-row { max-width: 92%; }
.og-col-row.sf-j { align-self: flex-end; background: #26282e; border-radius: 12px 12px 3px 12px; padding: 8px 12px; font: 13px/1.5 Inter, system-ui, sans-serif; color: #e9eae6; }
.og-col-row.sf-guy { align-self: flex-start; font: 13px/1.55 Inter, system-ui, sans-serif; color: #d4d5da; white-space: pre-wrap; }
@media (max-width: 700px) {
  .og-col-turns { padding-bottom: 110px; }
  .og-col-row { max-width: 96%; }
}
@media (prefers-reduced-motion: reduce) { .og-col, body.og-col-open #og-stage, body.og-col-open #og-brief, body.og-col-open #og-backdrop, body.og-col-open #og-tendrils, body.og-col-open .tk-bar, body.og-col-open .tk-undo { transition: none; } .tk-fly { display: none; } }

@media (max-width: 700px) {
  /* the orb docks beside the bar (42px on the left), and with a conversation open the bar is still the
     whole bar — the desktop column rule above would slide it off the left edge () */
  .tk-bar, body.og-col-open .tk-bar { left: calc(50% + 21px); width: calc(100vw - 20px - 42px); }
  body.og-col-open .tk-undo { left: 50%; }
  .tk-input { font-size: 16px; }   /* ≥ 16px or iOS zooms the page on focus */
  .tk-about { max-width: 44%; font-size: 13px; }
  .tk-bar { gap: 4px; padding-left: 6px; }
  .sf-turns { max-height: 34vh; }
}
